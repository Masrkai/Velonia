# ~/.config/foot/foot.ini
[main]
# Foot uses fontconfig names, not PostScript names. Verify with: fc-list | grep -i iosevka
font=Iosevka Fixed Heavy Extended:style=Oblique:size=14, Symbols Nerd Font:size=14
pad=0x0
selection-target=none

[bell]
urgent=no
notify=no
visual=no

[scrollback]
lines=10000


[cursor]
style=underline
blink=yes
blink-rate=500
underline-thickness=5px

[colors-dark]
alpha=0.8
foreground=c0caf5
background=1a1b26
selection-foreground=1a1b26
selection-background=7aa2f7

# text color, then cursor color
cursor=1a1b26 c0caf5

regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

[csd]
# Titlebar color (only matters if the compositor doesn't draw server-side decorations)
color=ff1a1b26

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
search-start=Control+Shift+h

[text-bindings]
# Shift+Enter sends the same escape sequence as your kitty mapping
\x1b[13;2u=Shift+Return
